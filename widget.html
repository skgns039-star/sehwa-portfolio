      subs: [
        { slug: 'susong-otu-2', name: '수송동 오투 2차', count: 24, cover: 24, desc: '간접조명과 유리 파티션으로 욕실과 실내를 새로 꾸민 현장입니다.' },
        { slug: 'susong-otu-1', name: '수송동 오투 1차', count: 61, cover: 53, desc: '복층 구조 전체를 철거한 뒤 다시 구성한 대규모 인테리어입니다.' },
        { slug: 'haenazio', name: '해나지오', count: 16, cover: 13, desc: '주거 공간의 마감재와 조명을 전면 교체했습니다.' },
        { slug: 'miryong-greenvill', name: '미룡 그린빌 3차', count: 16, cover: 13, desc: '아파트 실내 리모델링으로 도장과 마감을 새로 했습니다.' },
        { slug: 'office-renewal', name: '사무실 환경개선', count: 11, cover: 11, desc: '사무 공간의 벽체와 도장을 정비한 환경개선 공사입니다.' },
        { slug: 'lounge-remodel', name: '매립장 휴게실', count: 21, cover: 18, desc: '근무자 휴게실을 단열 보강과 함께 새로 만들었습니다.' },
        { slug: 'ceiling-tex', name: '천정 텍스 교체', count: 18, cover: 16, desc: '노후 천정재를 철거하고 텍스로 교체한 현장입니다.' }
      ]
    },
    {
      slug: 'maintenance', name: '유지보수', heroSub: 0, heroImg: 13,
      tagline: '누수와 노후를 근본 원인부터 잡아 건물 수명을 늘립니다.',
      desc: '공장 지붕 누수, 강판 부식, 노후 창호까지 원인을 진단하고 구간별로 보수합니다. 시공 전후를 그대로 담은 기록입니다.',
      subs: [
        { slug: 'roof-leak-panel', name: '공장 지붕 누수 강판보수', count: 18, cover: 13, desc: '누수 구간을 걷어내고 거멀접기 강판으로 새로 덮었습니다.' },
        { slug: 'roof-corrosion-panel', name: '부식 지붕 강판시공', count: 19, cover: 18, desc: '부식이 진행된 지붕을 강판으로 재시공했습니다.' },
        { slug: 'roof-panel-repair', name: '공장 지붕 강판보수', count: 16, cover: 15, desc: '공장 지붕의 손상 구간을 강판으로 보수했습니다.' },
        { slug: 'gutter-roof-repair', name: '물받이·지붕판 보수', count: 23, cover: 23, desc: '물받이와 지붕판을 함께 정비해 누수를 차단했습니다.' },
        { slug: 'gutter-epdm', name: '물받이 EPDM 방수', count: 31, cover: 30, desc: '물받이 누수 구간에 EPDM 고무 방수를 시공했습니다.' },
        { slug: 'roof-epdm', name: '지붕 EPDM 고무판', count: 23, cover: 23, desc: '지붕 골 누수부에 EPDM 고무판을 덮어 방수했습니다.' },
        { slug: 'tata-daewoo-panel', name: '타타대우 공장 강판보수', count: 23, cover: 23, desc: '대형 공장동 지붕 강판을 구간별로 교체했습니다.' },
        { slug: 'jeju-roof-repair', name: '제주 지붕 강판보수', count: 4, cover: 4, desc: '제주 현장의 지붕 강판을 보수한 기록입니다.' },
        { slug: 'canopy-install', name: '외부 캐노피 설치', count: 8, cover: 7, desc: '출입구 상부에 캐노피를 제작해 설치했습니다.' },
        { slug: 'window-replace', name: '노후 창호 교체', count: 12, cover: 8, desc: '노후 창호를 철거하고 단열 창호로 교체했습니다.' },
        { slug: 'firedoor-replace', name: '노후 방화문 교체', count: 19, cover: 18, desc: '노후 방화문을 규격에 맞는 새 제품으로 교체했습니다.' },
        { slug: 'silicone-repair', name: '외벽 실리콘 보수', count: 13, cover: 13, desc: '외벽 창호 둘레의 실리콘을 걷어내고 다시 코킹했습니다.' }
      ]
    }
  ];

  /* 구형 브라우저용 NodeList.forEach 보강 */
  if (window.NodeList && !NodeList.prototype.forEach) {
    NodeList.prototype.forEach = Array.prototype.forEach;
  }

  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var imgUrl = function (cat, sub, n) { return IMG_BASE + cat.slug + '/' + sub.slug + '/' + pad(n) + '.jpg'; };

  var grid = document.getElementById('shwGrid');
  var modal = document.getElementById('shwModal');
  var tabsEl = document.getElementById('shwTabs');
  var galleryEl = document.getElementById('shwGallery');
  var lightbox = document.getElementById('shwLightbox');
  var lbImg = document.getElementById('shwLbImg');
  var curCat = null, curSub = null, curOrder = [], curPos = 0, prevOverflow = '';

  /* 아임웹 상위 섹션의 transform 효과로 fixed 위치가 깨지지 않도록 body 직속으로 이동 */
  document.body.appendChild(modal);
  document.body.appendChild(lightbox);

  /* ── 그리드 카드 ── */
  DATA.forEach(function (cat, i) {
    var total = cat.subs.reduce(function (s, x) { return s + x.count; }, 0);
    var card = document.createElement('div');
    card.className = 'shw-card';
    card.innerHTML =
      '<div class="shw-card-figure">' +
        '<img src="' + imgUrl(cat, cat.subs[cat.heroSub], cat.heroImg) + '" alt="' + cat.name + ' 시공 사례" loading="lazy">' +
        '<div class="shw-card-veil"></div>' +
        '<span class="shw-card-badge">' + cat.subs.length + '개 프로젝트</span>' +
        '<span class="shw-card-cta">시공 사례 보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></span>' +
      '</div>' +
      '<div class="shw-card-body">' +
        '<h3 class="shw-card-title">' + cat.name + ' <small>사진 ' + total + '장</small></h3>' +
        '<p class="shw-card-copy">' + cat.tagline + '</p>' +
      '</div>';
    card.addEventListener('click', function () { openModal(i); });
    grid.appendChild(card);
  });

  /* 스크롤 등장 모션 */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e, idx) {
        if (e.isIntersecting) {
          var el = e.target;
          setTimeout(function () { el.classList.add('shw-in'); }, (idx % 3) * 110);
          io.unobserve(el);
        }
      });
    }, { threshold: 0.15 });
    grid.querySelectorAll('.shw-card').forEach(function (c) { io.observe(c); });
  } else {
    grid.querySelectorAll('.shw-card').forEach(function (c) { c.classList.add('shw-in'); });
  }

  /* ── 상세 모달 ── */
  function openModal(catIdx) {
    curCat = DATA[catIdx];
    document.getElementById('shwModalTitle').textContent = curCat.name;
    document.getElementById('shwModalDesc').textContent = curCat.desc;
    tabsEl.innerHTML = '';
    curCat.subs.forEach(function (sub, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'shw-tab';
      b.textContent = sub.name;
      b.addEventListener('click', function () { selectSub(i); });
      tabsEl.appendChild(b);
    });
    selectSub(0);
    modal.classList.add('shw-open');
    prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
  }

  function selectSub(subIdx) {
    curSub = curCat.subs[subIdx];
    tabsEl.querySelectorAll('.shw-tab').forEach(function (t, i) {
      t.classList.toggle('shw-on', i === subIdx);
    });
    document.getElementById('shwSubDesc').textContent = curSub.desc + ' (사진 ' + curSub.count + '장)';
    galleryEl.innerHTML = '';
    /* 대표 사진을 맨 앞에 배치 */
    curOrder = [curSub.cover];
    for (var k = 1; k <= curSub.count; k++) { if (k !== curSub.cover) curOrder.push(k); }
    curOrder.forEach(function (n) {
        var shot = document.createElement('div');
        shot.className = 'shw-shot';
        shot.innerHTML = '<img src="' + imgUrl(curCat, curSub, n) + '" alt="' + curSub.name + ' 시공 사진 ' + n + '" loading="lazy">';
        shot.addEventListener('click', function () { openLightbox(n); });
        galleryEl.appendChild(shot);
    });
    modal.querySelector('.shw-modal-panel').scrollTop = 0;
  }

  function closeModal() {
    modal.classList.remove('shw-open');
    document.body.style.overflow = prevOverflow;
  }
  modal.querySelectorAll('[data-shw-close]').forEach(function (el) {
    el.addEventListener('click', closeModal);
  });

  /* ── 라이트박스 ── */
  function openLightbox(n) {
    curPos = curOrder.indexOf(n);
    if (curPos < 0) curPos = 0;
    lbImg.src = imgUrl(curCat, curSub, n);
    lbImg.alt = curSub.name + ' 시공 사진 ' + n;
    document.getElementById('shwLbCount').textContent = (curPos + 1) + ' / ' + curSub.count;
    lightbox.classList.add('shw-open');
  }
  function closeLightbox() { lightbox.classList.remove('shw-open'); }
  function nav(dir) {
    curPos = (curPos + dir + curOrder.length) % curOrder.length;
    openLightbox(curOrder[curPos]);
  }
  lightbox.querySelector('[data-shw-lbclose]').addEventListener('click', closeLightbox);
  lightbox.querySelectorAll('[data-shw-nav]').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      nav(parseInt(b.getAttribute('data-shw-nav'), 10));
    });
  });
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  /* 키보드 */
  document.addEventListener('keydown', function (e) {
    if (lightbox.classList.contains('shw-open')) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') nav(-1);
      if (e.key === 'ArrowRight') nav(1);
    } else if (modal.classList.contains('shw-open') && e.key === 'Escape') {
      closeModal();
    }
  });

  /* 모바일 스와이프 */
  var touchX = null;
  lightbox.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  lightbox.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 48) nav(dx > 0 ? -1 : 1);
    touchX = null;
  }, { passive: true });
})();
</script>
